services:
  mongo:
    image: mongo:7.0
    container_name: chatapp-mongo
    restart: unless-stopped
    ports:
      - "27018:27017"
    volumes:
      - mongo_data:/data/db

  backend:
    build: .
    container_name: chatapp-backend
    restart: unless-stopped
    ports:
      - "4000:4000"
    environment:
      - PORT=4000
      - MONGODB_URI=mongodb://mongo:27017/chatapp_db
      - JWT_SECRET=super-secret-jwt-key-for-realtime-chat-app-development-32chars
      - CORS_ORIGIN=http://localhost:5173
      - NODE_ENV=production
    depends_on:
      - mongo

volumes:
  mongo_data:
